<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Products | DE-SALE</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
<script>
if (!localStorage.getItem("loggedInUser")) {
  window.location.href = "login.html";
}
</script>

<header>
  <h1 class="logo">DE<span>SALE</span></h1>
  <nav>
    <a href="index.html">Home</a>
    <a href="products.html">Products</a>
    <a href="cart.html">Cart</a>
    <a href="checkout.html">Checkout</a>
    <a href="track.html">Track Order</a>
    <a href="about.html">About</a>
    <a href="contact.html">Contact</a>
  </nav>
  <button class="theme-toggle" onclick="toggleTheme()">Theme</button>
</header>

<section class="section">
  <div class="section-heading">
    <span>Fresh drops</span>
    <h2>Shop by category, vibe, or budget</h2>
  </div>

  <div class="catalog-tools">
    <input type="search" id="product-search" placeholder="Search laptops, audio, RGB...">
    <select id="product-sort" aria-label="Sort products">
      <option value="featured">Featured</option>
      <option value="price-low">Price: Low to High</option>
      <option value="price-high">Price: High to Low</option>
    </select>
    <input type="hidden" id="product-category" value="All">
  </div>

  <div id="category-tabs" class="category-tabs"></div>
  <div id="catalog-products" class="products"></div>
</section>

<footer>
  <p>&copy; 2026 DE-SALE</p>
</footer>

<script>
function logout() {
  localStorage.removeItem("loggedInUser");
  window.location.href = "login.html";
}

function toggleTheme() {
  document.body.classList.toggle("dark");
  localStorage.setItem("theme", document.body.classList.contains("dark") ? "dark" : "light");
}

document.addEventListener("DOMContentLoaded", function () {
  if (localStorage.getItem("theme") === "dark") {
    document.body.classList.add("dark");
  }
});
</script>
<script src="js/catalog.js"></script>
</body>
</html>
